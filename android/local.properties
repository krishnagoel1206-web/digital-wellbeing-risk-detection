# Machine-local Android paths. Tracked deliberately - see android/.gitignore.
#
# Forward slashes are used throughout: this is a Java .properties file, where
# a backslash is an escape character, so "C:\Android" would be read as
# "C:Android". Forward slashes need no escaping and AGP accepts them.

sdk.dir=C:/Users/Krishna Goel/AppData/Local/Android/Sdk

# ndk.dir deliberately points at a SPACE-FREE COPY of the NDK.
#
# WHY: the NDK's android.toolchain.cmake does not survive a path containing a
# space together with backslashes - backslash is also CMake's escape
# character, so "C:\Users\Krishna Goel\..." mangles into invalid escapes. The
# visible symptom is that the C++ STL silently disappears from the link line,
# producing hundreds of undefined libc++ symbols (operator delete,
# __cxa_throw, std::__ndk1::*) while building react-native-screens and
# react-native-worklets.
#
# Verified before applying this fix:
#   - ANDROID_STL=c++_shared WAS set in CMakeCache.txt
#   - libc++_shared.so DID exist in the NDK sysroot
#   - yet "c++_shared" appeared 0 times in the generated build.ninja
#
# The original NDK under the Android SDK is left untouched, so Android Studio
# keeps working unchanged. This is an additive fix.
ndk.dir=C:/Android/ndk/27.1.12297006
